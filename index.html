<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Dockyard Stack</title>
  </head>
  <body>
    <main id="app">
      <canvas id="scene"></canvas>
      <div id="loader" class="loader" role="status">Loading dockyard</div>
    </main>
    <div class="hud" aria-label="Game HUD">
      <div class="hud__brand">
        <span class="brand-mark"></span>
        <span>Dockyard Stack</span>
      </div>
      <div class="hud__stats">
        <span id="data-mode">Mock data</span>
        <span id="fps">-- fps</span>
        <span id="status">Loading dockyard</span>
        <div class="hud__actions">
          <button class="icon-button" id="reset-view" type="button" title="Reset view" aria-label="Reset view">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M3 12a9 9 0 1 0 3-6.7" />
              <path d="M3 4v6h6" />
            </svg>
          </button>
          <button class="icon-button" id="fullscreen" type="button" title="Fullscreen" aria-label="Fullscreen">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M8 3H3v5" />
              <path d="M16 3h5v5" />
              <path d="M21 16v5h-5" />
              <path d="M8 21H3v-5" />
            </svg>
          </button>
        </div>
      </div>
    </div>
    <div class="camera-scroll" aria-label="Camera height control">
      <span aria-hidden="true">UP</span>
      <input
        id="camera-height"
        type="range"
        min="0"
        max="1000"
        value="0"
        aria-label="Move camera up or down the stack"
      />
      <span aria-hidden="true">DN</span>
    </div>
    <div class="control-panel" aria-label="Game controls">
      <div class="panel-value panel-value--balance">
        <span>Balance</span>
        <strong id="balance">-- SC</strong>
      </div>
      <label class="panel-value panel-value--difficulty">
        <span>Difficulty</span>
        <select id="difficulty">
          <option value="easy">Easy</option>
          <option value="medium">Medium</option>
          <option value="hard">Hard</option>
          <option value="hardcore">Hardcore</option>
        </select>
      </label>
      <button class="cashout-button" id="cash-out" type="button" disabled>Cash Out</button>
      <label class="panel-value panel-value--bet">
        <span>Bet</span>
        <input id="bet-amount" type="number" min="0.1" max="100" step="0.01" value="1" />
      </label>
      <input id="client-seed" type="hidden" value="local-seed" />
      <button class="action-button" id="primary-action" type="button" disabled>Play</button>
      <button class="reset-button" id="reset-round" type="button" aria-label="Reset round" title="Reset round">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M3 12a9 9 0 1 0 3-6.7" />
          <path d="M3 4v6h6" />
        </svg>
      </button>
      <div class="round-details" id="round-details">No active round</div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
